<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelZone - Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="main-header">
        <div class="logo-container">
            <h1>PixelZone</h1>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html" target="_blank">Catálogo</a></li>
                <li><a href="contacto.html" target="_blank" class="active">Iniciar Sesión</a></li>
                <li><a href="registro.html" target="_blank">Registrarse</a></li>
            </ul>
        </nav>
    </header>

    <main class="hero-section">
        <h2>Iniciar Sesión</h2>
        <p>Ingresa tus credenciales para acceder a tu cuenta.</p>

        <form style="max-width: 400px; margin: 20px auto; text-align: left;">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Correo Electrónico:</label>
                <input type="email" placeholder="ejemplo@correo.cl" style="width: 100%; padding: 8px; border: 1px solid #ccc;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Contraseña:</label>
                <input type="password" placeholder="Ingresa tu contraseña" style="width: 100%; padding: 8px; border: 1px solid #ccc;">
            </div>

            <button type="button" class="btn btn-primary" onclick="alert('Sesión iniciada correctamente')">Iniciar Sesión</button>
            <a href="index.html" style="margin-left: 15px; color: #0066cc; text-decoration: none;">Volver al Inicio</a>
        </form>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <p>&copy; 2026 PixelZone Store. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>
</html>
